  <!-- Override the two old links to point to the new site -->
  <script>
  (function () {
    var NEW = 'https://mpsyria.com';
    var OLD_HOSTS = ['mspsy.com','www.mspsy.com'];

    function swapLinks() {
      document.querySelectorAll('a[href]').forEach(function(a){
        var href = a.getAttribute('href') || '';
        var text = (a.textContent || '').trim().toLowerCase();
        var host = '';
        try { host = new URL(href, location.origin).hostname; } catch(e){}

        var isOld = OLD_HOSTS.indexOf(host) !== -1;
        var looksLikeParty = text === 'join the party' ||
                             text.includes('movement for a pluralistic society');

        if (isOld || looksLikeParty) {
          a.setAttribute('href', NEW);
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      swapLinks();
      var i=0, t=setInterval(function(){
        swapLinks();
        if(++i>25) clearInterval(t);
      }, 120);
    });
  })();
  </script>
